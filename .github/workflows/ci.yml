name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Grant Gradle permissions
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Compile and test
        run: ./gradlew check --no-daemon

  docs-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Required documentation present
        run: |
          set -e
          test -f README.md
          test -f LICENSE
          test -f docs/mechanism-control/research.md
          test -f docs/mechanism-control/build-vs-adopt.md
          test -f docs/mechanism-control/architecture.md
          test -f docs/mechanism-control/phases.md
          test -f docs/mechanism-control/references.md
          test -f docs/audits/initial-deep-audit.md
          test -f docs/audits/priority-ledger.md
